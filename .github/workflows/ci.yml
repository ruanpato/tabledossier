name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked development tools
        run: |
          python -m pip install uv
          uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit:
    name: Unit tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the wheel (no Spark, no network after install)
        shell: bash
        run: |
          python -m pip install build pytest
          python -m build
          python -m pip install dist/*.whl
      - name: Unit tests against the installed wheel
        run: python -m pytest tests/unit
      - name: Quickstart smoke test
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qs" && cd "$RUNNER_TEMP/qs"
          tabledossier init --output profile.config.json
          tabledossier validate --config profile.config.json
          tabledossier generate --config profile.config.json --output dist/profile_databricks.py
          tabledossier render --input "$GITHUB_WORKSPACE/examples/demo/output/run/profile.json" --output docs/generated
          python -c "import sys; import tabledossier.cli; assert 'pyspark' not in sys.modules"
          python -c "import sys; import tabledossier.cli; assert 'psycopg' not in sys.modules"
      - name: Wheel contents
        shell: bash
        run: |
          python - <<'PY'
          import glob, zipfile
          from tabledossier import __version__ as version
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for required in ("tabledossier/py.typed", "tabledossier/schemas/profile.schema.json",
                           "tabledossier/connectors/postgres.py",
                           "tabledossier/schemas/profile-1.2.schema.json",
                           f"tabledossier-{version}.dist-info/licenses/LICENSE",
                           f"tabledossier-{version}.dist-info/licenses/NOTICE"):
              assert any(n.endswith(required.split("/", 1)[1]) for n in names), required
          PY

  spark:
    name: Spark integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "PySpark 3.5 + Delta (DBR 15.4/16.4 line)"
            packages: "'pyspark>=3.5.2,<3.6' 'delta-spark>=3.2,<3.4'"
            mode: classic
          - name: "PySpark 4.0 (DBR 17.3 line)"
            packages: "'pyspark>=4.0,<4.1'"
            mode: classic
          # Shared access mode and serverless compute use Spark Connect: the whole suite runs
          # through a local Spark Connect server started by SparkSession.builder.remote("local[2]").
          # PySpark 3.5's connect extra pins numpy<2, and pyarrow 26 needs NumPy 2: keep pyarrow
          # below 26 or the Connect client dependencies cannot be imported.
          - name: "Spark Connect 3.5 + Delta (DBR 15.4/16.4 line)"
            packages: "'pyspark[connect]>=3.5.2,<3.6' 'delta-spark>=3.2,<3.4' setuptools 'pyarrow<26'"
            mode: connect
          - name: "Spark Connect 4.0 (DBR 17.3 line)"
            packages: "'pyspark[connect]>=4.0,<4.1'"
            mode: connect
    env:
      TD_TEST_SPARK_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install
        run: python -m pip install -e . pytest ${{ matrix.packages }}
      - name: Integration tests (real local Spark, synthetic data, no credentials)
        run: python -m pytest tests/integration -ra

  # Not among the required checks of the rulesets: an administrator decides whether to add them.
  postgres:
    name: PostgreSQL integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported major (end of life 2026-11-12) with the lowest psycopg the extra allows.
          - name: "PostgreSQL 14, psycopg 3.2"
            image: "postgres:14"
            driver: "psycopg[binary]==3.2.*"
          - name: "PostgreSQL 18, psycopg 3.3"
            image: "postgres:18"
            driver: "psycopg[binary]>=3.3,<4"
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: ci-only-synthetic-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A disposable CI service container; the tests create their own database and roles.
      TD_TEST_POSTGRES_DSN: "host=localhost port=5432 user=postgres password=ci-only-synthetic-password dbname=postgres"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with the postgres extra
        run: python -m pip install -e ".[postgres]" pytest "${{ matrix.driver }}"
      - name: Server and driver versions
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["TD_TEST_POSTGRES_DSN"]) as conn:
              print("server", conn.execute("SHOW server_version").fetchone()[0])
          print("psycopg", psycopg.__version__, "libpq", psycopg.pq.version())
          PY
      - name: The offline commands never import the installed driver
        run: |
          python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('psycopg') else 1)"
          python -m pytest tests/unit/test_postgres_cli.py tests/unit/test_notebook.py -ra
      - name: Integration tests (synthetic data, a SELECT-only role, no credentials in output)
        run: python -m pytest tests/postgres -ra
