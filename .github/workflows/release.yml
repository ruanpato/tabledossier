name: Release

# A tag v* (created by an administrator on a merge commit of main) builds and verifies the release artefacts
# and creates a DRAFT GitHub release with them; a person reviews and publishes it. Nothing is published to PyPI.
# Pull requests that touch the release inputs run the same build and checks as a dry run, without publishing.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release.py"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - "src/tabledossier/_version.py"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release artefacts (build, unit tests, notes, checksums)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      title: ${{ steps.check.outputs.title }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Select the tag (real on tag pushes, derived from the version on pull requests)
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "DRY_RUN=" >> "$GITHUB_ENV"
          else
            echo "TAG=v$(python scripts/release.py version)" >> "$GITHUB_ENV"
            echo "DRY_RUN=--dry-run" >> "$GITHUB_ENV"
          fi
      - name: The tag matches __version__ and the CHANGELOG has a dated section for it
        id: check
        shell: bash
        run: python scripts/release.py check --tag "$TAG" --repository "$GITHUB_REPOSITORY" $DRY_RUN | tee -a "$GITHUB_OUTPUT"
      - name: The tagged commit is on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build the wheel and the sdist
        shell: bash
        run: |
          python -m pip install build pytest
          python -m build
          ls -l dist
          test -f "dist/tabledossier-${{ steps.check.outputs.version }}-py3-none-any.whl"
          test -f "dist/tabledossier-${{ steps.check.outputs.version }}.tar.gz"
      - name: Unit tests against the built wheel
        shell: bash
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          python -m pip install "dist/tabledossier-$VERSION-py3-none-any.whl"
          python -c "import sys, tabledossier; assert tabledossier.__version__ == sys.argv[1]; assert 'site-packages' in tabledossier.__file__, tabledossier.__file__" "$VERSION"
          python -m pytest tests/unit
      - name: Release notes from the CHANGELOG section
        shell: bash
        run: |
          python scripts/release.py notes --tag "$TAG" --repository "$GITHUB_REPOSITORY" --output release-notes.md $DRY_RUN
          cat release-notes.md
      - name: Checksums
        shell: bash
        working-directory: dist
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          sha256sum "tabledossier-$VERSION-py3-none-any.whl" "tabledossier-$VERSION.tar.gz" > SHA256SUMS
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.check.outputs.version }}
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Draft the GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.version }}
      - name: Create the draft release (a person reviews and publishes it)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          TITLE: ${{ needs.build.outputs.title }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            --title "$TITLE" --notes-file release-notes.md \
            "dist/tabledossier-$VERSION-py3-none-any.whl" "dist/tabledossier-$VERSION.tar.gz" dist/SHA256SUMS
